<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Aegisub automation pack banner</title>
  <desc id="desc">Animated banner for Lua MoonScript macros, ASS subtitle workflow, typesetting, shape tools and motion utilities.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="42%" stop-color="#0f766e"/>
      <stop offset="72%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes floatA { 0%,100% { transform: translateY(0); opacity: .72; } 50% { transform: translateY(-11px); opacity: 1; } }
      @keyframes floatB { 0%,100% { transform: translateY(0); opacity: .40; } 50% { transform: translateY(10px); opacity: .88; } }
      @keyframes dash { to { stroke-dashoffset: -240; } }
      @keyframes scan { 0% { transform: translateX(-200px); opacity: 0; } 18%,76% { opacity: .95; } 100% { transform: translateX(1240px); opacity: 0; } }
      @keyframes blink { 0%,44%,100% { opacity: .25; } 50%,86% { opacity: 1; } }
      .chip { fill: rgba(15,23,42,.46); stroke: rgba(255,255,255,.24); stroke-width: 1; }
      .small { font: 700 21px 'Segoe UI', Arial, sans-serif; fill: #e0f2fe; }
      .tiny { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #ecfeff; }
      .title { font: 900 58px 'Segoe UI', Arial, sans-serif; fill: #fff; }
      .sub { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #dbeafe; }
      .mono { font: 700 18px Consolas, 'Fira Code', monospace; fill: #a7f3d0; }
    </style>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <g opacity=".18">
    <circle cx="130" cy="72" r="118" fill="#22d3ee">
      <animate attributeName="r" values="108;132;108" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="222" r="154" fill="#f472b6">
      <animate attributeName="r" values="140;168;140" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <path d="M0 236 C150 188 286 270 442 224 C608 174 738 180 892 220 C1038 258 1112 204 1200 220 L1200 300 L0 300 Z" fill="#020617" opacity=".30"/>
  <path d="M-10 216 C150 172 278 246 438 204 C610 158 744 160 902 204 C1034 242 1112 190 1210 206" fill="none" stroke="url(#pulse)" stroke-width="4" stroke-linecap="round" stroke-dasharray="24 20" filter="url(#glow)" style="animation: dash 8s linear infinite"/>
  <g style="animation: floatA 6s ease-in-out infinite">
    <rect x="72" y="48" width="206" height="54" rx="16" class="chip"/>
    <text x="98" y="82" class="small">Lua Macros</text>
  </g>
  <g style="animation: floatB 7s ease-in-out infinite">
    <rect x="900" y="50" width="226" height="54" rx="16" class="chip"/>
    <text x="925" y="84" class="small">MoonScript</text>
  </g>
  <g style="animation: floatA 7.4s ease-in-out infinite">
    <rect x="92" y="204" width="242" height="54" rx="16" class="chip"/>
    <text x="118" y="238" class="small">ASS Typesetting</text>
  </g>
  <g style="animation: floatB 6.6s ease-in-out infinite">
    <rect x="858" y="198" width="246" height="54" rx="16" class="chip"/>
    <text x="884" y="232" class="small">Shape + Motion</text>
  </g>
  <g transform="translate(350 62)">
    <text x="0" y="0" class="mono">// subtitle -&gt; macro -&gt; motion -&gt; clean release</text>
    <text x="0" y="74" class="title">AEGISUB AUTOMATION</text>
    <text x="0" y="118" class="sub">Reusable config, hotkeys, includes and subtitle tools</text>
    <g transform="translate(0 150)">
      <rect width="86" height="30" rx="15" fill="rgba(255,255,255,.16)" stroke="rgba(255,255,255,.24)"/>
      <text x="24" y="20" class="tiny">ASS</text>
      <rect x="102" width="94" height="30" rx="15" fill="rgba(255,255,255,.16)" stroke="rgba(255,255,255,.24)"/>
      <text x="126" y="20" class="tiny">Fade</text>
      <rect x="212" width="102" height="30" rx="15" fill="rgba(255,255,255,.16)" stroke="rgba(255,255,255,.24)"/>
      <text x="235" y="20" class="tiny">Color</text>
      <rect x="330" width="112" height="30" rx="15" fill="rgba(255,255,255,.16)" stroke="rgba(255,255,255,.24)"/>
      <text x="355" y="20" class="tiny">Vector</text>
      <rect x="458" width="112" height="30" rx="15" fill="rgba(255,255,255,.16)" stroke="rgba(255,255,255,.24)"/>
      <text x="482" y="20" class="tiny">Motion</text>
    </g>
  </g>
  <g opacity=".9" filter="url(#glow)">
    <line x1="0" y1="34" x2="190" y2="34" stroke="#a7f3d0" stroke-width="2" style="animation: scan 6s linear infinite"/>
    <line x1="0" y1="266" x2="150" y2="266" stroke="#bfdbfe" stroke-width="2" style="animation: scan 7.5s linear infinite"/>
  </g>
  <g fill="#e0f2fe" style="animation: blink 2.4s ease-in-out infinite">
    <circle cx="326" cy="96" r="5"/>
    <circle cx="850" cy="96" r="5"/>
    <circle cx="784" cy="224" r="5"/>
    <circle cx="342" cy="226" r="5"/>
  </g>
</svg>
