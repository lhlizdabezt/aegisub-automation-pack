<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">ASS effect pipeline</title>
  <desc id="desc">Pipeline diagram for subtitle timing, color phase, blur glow, render preview and release.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="48%" stop-color="#0f3f5f"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="45%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes moveDash { to { } }
      @keyframes pulse { 0%,100% { opacity: .72; transform: scale(1); } 50% { opacity: 1; transform: scale(1.035); } }
      @keyframes scan { 0% { transform: translateX(-160px); opacity: 0; } 18%,80% { opacity: .9; } 100% { transform: translateX(1230px); opacity: 0; } }
      .title { font: 900 44px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .subtitle { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #dbeafe; }
      .box-title { font: 900 23px 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
      .box-text { font: 650 16px 'Segoe UI', Arial, sans-serif; fill: #dbeafe; }
      .mono { font: 700 15px Consolas, monospace; fill: #bae6fd; }
      .box { fill: rgba(15, 23, 42, .66); stroke: rgba(255, 255, 255, .22); stroke-width: 1.4; }
    </style>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <g opacity=".14">
    <circle cx="120" cy="80" r="110" fill="#22d3ee">
      <animate attributeName="r" values="96;128;96" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="330" r="130" fill="#f59e0b">
      <animate attributeName="r" values="112;146;112" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="60" y="72" class="title">Aegisub ASS Effect Pipeline</text>
  <text x="62" y="108" class="subtitle">Timing -> phase color -> glow layer -> white layer -> FFmpeg preview -> release</text>
  <path d="M130 214 H1068" fill="none" stroke="url(#line)" stroke-width="7" stroke-linecap="round" filter="url(#glow)" style="animation: moveDash 7s linear infinite"/>
  <g style="animation: pulse 5.8s ease-in-out infinite; transform-origin: 170px 214px">
    <rect class="box" x="54" y="150" width="190" height="128" rx="18"/>
    <text x="82" y="190" class="box-title">01 Timing</text>
    <text x="82" y="222" class="box-text">sync start/end</text>
    <text x="82" y="250" class="mono">\fad(120,150)</text>
  </g>
  <g style="animation: pulse 6.2s ease-in-out infinite; transform-origin: 385px 214px">
    <rect class="box" x="290" y="150" width="190" height="128" rx="18"/>
    <text x="318" y="190" class="box-title">02 Color</text>
    <text x="318" y="222" class="box-text">match scene</text>
    <text x="318" y="250" class="mono">&amp;H7E5D31&amp;</text>
  </g>
  <g style="animation: pulse 5.4s ease-in-out infinite; transform-origin: 600px 214px">
    <rect class="box" x="526" y="150" width="190" height="128" rx="18"/>
    <text x="554" y="190" class="box-title">03 Glow</text>
    <text x="554" y="222" class="box-text">colored bottom</text>
    <text x="554" y="250" class="mono">\blur7.5\bord6.5</text>
  </g>
  <g style="animation: pulse 6.6s ease-in-out infinite; transform-origin: 835px 214px">
    <rect class="box" x="762" y="150" width="190" height="128" rx="18"/>
    <text x="790" y="190" class="box-title">04 White</text>
    <text x="790" y="222" class="box-text">clean top layer</text>
    <text x="790" y="250" class="mono">\c&amp;HFFFFFF&amp;</text>
  </g>
  <g style="animation: pulse 5.9s ease-in-out infinite; transform-origin: 1065px 214px">
    <rect class="box" x="998" y="150" width="150" height="128" rx="18"/>
    <text x="1026" y="190" class="box-title">05 QA</text>
    <text x="1026" y="222" class="box-text">render crop</text>
    <text x="1026" y="250" class="mono">ffmpeg</text>
  </g>
  <line x1="0" y1="352" x2="190" y2="352" stroke="#bae6fd" stroke-width="2.4" filter="url(#glow)" style="animation: scan 6s linear infinite"/>
  <line x1="0" y1="34" x2="150" y2="34" stroke="#fef3c7" stroke-width="2" filter="url(#glow)" style="animation: scan 7.5s linear infinite"/>
</svg>
